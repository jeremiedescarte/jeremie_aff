<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Dégradé pour la forme principale (Bleu) -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="30%" y2="100%">
      <stop offset="0%" stop-color="#00b4fc" />
      <stop offset="100%" stop-color="#005bc4" />
    </linearGradient>
    
    <!-- Dégradé pour la courbe transversale (Vert) -->
    <linearGradient id="greenGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#73c713" />
      <stop offset="100%" stop-color="#319e12" />
    </linearGradient>
  </defs>

  <!-- Corps du "A" (Partie droite et sommet) -->
  <path d="M 165 285
           L 235 170
           Q 250 145 265 170
           L 360 325
           L 310 325
           L 250 220
           L 222 270
           Q 195 282 165 285
           Z"
        fill="url(#blueGrad)" />

  <!-- Courbe transversale (Jambe gauche et swoosh) -->
  <path d="M 140 325
           L 190 325
           C 220 290, 260 260, 305 248
           C 260 235, 200 295, 152 305
           Z"
        fill="url(#greenGrad)" />
</svg>
